[package]
name = "bevy_grass"
version = "2.0.0"
edition = "2024"
publish = false

# Compile the same renderer with the editor's Bevy source identity.
[lib]
path = "../../../../bevy_grass/crates/bevy_grass/src/lib.rs"
test = false
doctest = false

[dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = ["3d"] }
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gpu-capture", "experimental-dx12-interop", "mesh-shaders"))'] }
